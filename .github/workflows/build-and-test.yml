name: Build & Test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: All checks passed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install and cache the pinned toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache-base: main
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.prototools', 'bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun sort-package-json --check package.json 'apps/*/package.json' 'packages/*/package.json'
      - run: bun biome check . --error-on-warnings
      - run: moon run vite-plugin-rebyu:build playground:build
      - run: bun tsc --noEmit
      - run: bun knip
      - run: moon run vite-plugin-rebyu:test-unit vite-plugin-rebyu:test-integration
      - run: git diff --exit-code
