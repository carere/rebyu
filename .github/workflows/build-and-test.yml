name: Build & Test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: All checks passed
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository and full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install and cache the pinned toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache-base: main
      - name: Restore Bun package download cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.prototools', 'bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile
      - name: Check package manifest sorting
        run: bun sort-package-json --check package.json 'apps/*/package.json' 'packages/*/package.json'
      - name: Check formatting, lint rules, and imports
        run: bun biome check . --error-on-warnings
      - name: Build the Vite plugin and website
        run: moon run vite-plugin-rebyu:build website:build
      - name: Check TypeScript types
        run: bun tsc --noEmit
      - name: Check unused code and dependencies
        run: bun knip
      - name: Run unit and integration tests
        run: moon run vite-plugin-rebyu:test-unit vite-plugin-rebyu:test-integration
      - name: Install Chromium and browser test system dependencies
        working-directory: packages/vite-plugin-rebyu
        run: bunx --bun playwright install --with-deps chromium
      - name: Run widget and website browser regression tests
        run: moon run vite-plugin-rebyu:test-browser website:test-browser
      - name: Verify checks left tracked files unchanged
        run: git diff --exit-code
