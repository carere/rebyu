$schema: ../../.moon/cache/schemas/project.json
id: website
language: typescript
stack: frontend
tasks:
  dev:
    command: vite --host 0.0.0.0
    deps:
      - vite-plugin-rebyu:build
    preset: server
  build:
    command: vite build
    deps:
      - vite-plugin-rebyu:build
    inputs:
      - src/**/*
      - index.html
      - vite.config.ts
      - /assets/**/*
    outputs:
      - dist
  preview:
    command: vite preview --host 0.0.0.0
    deps:
      - ~:build
    preset: server
  deploy:
    command: wrangler deploy
    deps:
      - ~:build
    preset: utility
    options:
      cache: false
  deploy-check:
    command: wrangler deploy --dry-run --outdir ../../.moon/cache/cloudflare/website
    deps:
      - ~:build
    preset: utility
    options:
      cache: false
  seed:
    command: bun scripts/seed.ts
    preset: utility
    options:
      cache: false
  test-browser:
    command: playwright test
    deps:
      - ~:build
    options:
      cache: false
