$schema: ../../.moon/cache/schemas/project.json
id: vite-plugin-rebyu
language: typescript
stack: frontend
tasks:
  i18n:
    command: bun scripts/compile-i18n.ts
    inputs:
      - /project.inlang/settings.json
      - /messages/**/*.json
      - paraglide.config.ts
      - scripts/compile-i18n.ts
      - package.json
      - /bun.lock
    outputs:
      - src/i18n
  build-client:
    command: vite build --config vite.client.config.ts
    deps:
      - ~:i18n
    inputs:
      - /assets/*.svg
      - postcss/**/*
      - src/client/**/*
      - src/client-api.ts
      - src/constants.ts
      - src/schema.ts
      - vite.client.config.ts
      - paraglide.config.ts
      - /messages/**/*.json
      - /project.inlang/settings.json
    outputs:
      - dist/client
  build:
    command: tsup --config tsup.config.ts
    deps:
      - ~:build-client
    inputs:
      - src/**/*
      - vite.client.config.ts
      - tsup.config.ts
      - /tsconfig.json
    outputs:
      - dist/*.js
      - dist/*.d.ts
  test-unit:
    command: vitest run tests/unit
    deps:
      - ~:build-client
    options:
      cache: false
  test-integration:
    command: vitest run tests/integration
    deps:
      - ~:build
    options:
      cache: false
  test-browser:
    command: playwright test
    deps:
      - ~:build
    options:
      cache: false
